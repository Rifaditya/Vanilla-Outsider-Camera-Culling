plugins {
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
    mavenLocal()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive Jar of all versions/MC 26.1.2 and Modrinth profile'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    // 1. Central Outer Archive (MC 26.1.2)
                    def archiveDir = file("../../Archive Jar of all versions/MC 26.1.2")
                    if (!archiveDir.exists()) {
                        archiveDir.mkdirs()
                    }
                    copy {
                        from jarFile
                        into archiveDir
                    }
                    def sourcesJar = file("build/libs/${project.archives_base_name}-${project.mod_version}-sources.jar")
                    if (sourcesJar.exists()) {
                        copy {
                            from sourcesJar
                            into archiveDir
                        }
                    }
                    println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"
                    
                    // 2. Modrinth Profile Sync
                    def profilePaths = [
                        "C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.1.2/mods"
                    ]
                    profilePaths.each { p ->
                        def modrinthProfileMods = file(p)
                        if (modrinthProfileMods.exists()) {
                            modrinthProfileMods.listFiles().each { f ->
                                if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                    f.delete()
                                    println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                                }
                            }
                            copy {
                                from jarFile
                                into modrinthProfileMods
                            }
                            println "[MODRINTH-SYNC] Deployed ${jarFile.name} to ${p}"
                        }
                    }
                }
            }
        }
        build.finalizedBy(archiveTask)
    }
}
